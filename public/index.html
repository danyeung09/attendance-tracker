                  <I.Plus /> {t.newPerson}
                </button>
              </div>
              {activePeople(data).length === 0
                ? <p className="text-gray-400 text-sm italic">{t.noPeople}</p>
                : <div className="space-y-2">
                    {activePeople(data).map(p => {
                      const inGroups = data.groups.filter(g => g.memberIds.includes(p.id)).length;
                      return (
                        <div key={p.id} className="bg-white rounded-xl border border-gray-100 shadow-sm p-4">
                          <div className="flex items-center justify-between">
                            <div>
                              <p className="font-semibold text-gray-800">{p.firstName} {p.lastName}</p>
                              <p className="text-sm text-gray-500">{p.phone} · {t.groupCount(inGroups)}</p>
                            </div>

                    <label className="block text-sm font-medium text-gray-700 mb-1">{t.meetingNameLabel}</label>
                    <div className="grid grid-cols-2 gap-2">
                      <input value={mForm.name.en} onChange={e => setMForm(f=>({...f,name:{...f.name,en:e.target.value}}))} placeholder={t.nameEnLabel}
                        className="border border-gray-300 rounded-lg px-3 py-2 w-full text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
                      <input value={mForm.name.zh} onChange={e => setMForm(f=>({...f,name:{...f.name,zh:e.target.value}}))} placeholder={t.nameZhLabel}
                        className="border border-gray-300 rounded-lg px-3 py-2 w-full text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
                    </div>
                    <p className="text-xs text-gray-400 mt-1">{t.nameHint}</p>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">{t.dayOfWeekLabel}</label>
                    <select value={mForm.dayOfWeek} onChange={e => setMForm(f=>({...f,dayOfWeek:parseInt(e.target.value)}))}
                      className="border border-gray-300 rounded-lg px-3 py-2 w-full text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                      {t.days.map((d,i) => <option key={i} value={i}>{d}</option>)}
                    </select>
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setMForm(null)} className="flex-1 py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 text-sm">{t.cancel}</button>
                  <button onClick={saveMeeting} className="flex-1 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold text-sm">{t.saveMeeting}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ─── Bible SVG ────────────────────────────────────────────────────────────
    const BibleSVG = ({ size = 80, opacity = 0.07, rotate = 0 }) => (
      <svg width={size} height={size * 1.25} viewBox="0 0 80 100" fill="none"
        style={{ opacity, transform: `rotate(${rotate}deg)`, display:'block' }}>
        <rect x="0" y="2" width="10" height="96" rx="2" fill="#5C3317" />
        <rect x="8" y="0" width="66" height="100" rx="3" fill="#7B3F00" />
        <rect x="70" y="3" width="6" height="94" rx="1" fill="#D4A843" />
        <line x1="70" y1="15" x2="76" y2="15" stroke="#B8860B" strokeWidth="0.5" />
        <line x1="70" y1="25" x2="76" y2="25" stroke="#B8860B" strokeWidth="0.5" />
        <line x1="70" y1="35" x2="76" y2="35" stroke="#B8860B" strokeWidth="0.5" />
        <line x1="70" y1="45" x2="76" y2="45" stroke="#B8860B" strokeWidth="0.5" />
        <line x1="70" y1="55" x2="76" y2="55" stroke="#B8860B" strokeWidth="0.5" />
        <line x1="70" y1="65" x2="76" y2="65" stroke="#B8860B" strokeWidth="0.5" />
        <line x1="70" y1="75" x2="76" y2="75" stroke="#B8860B" strokeWidth="0.5" />
        <line x1="70" y1="85" x2="76" y2="85" stroke="#B8860B" strokeWidth="0.5" />
        <rect x="35" y="22" width="6" height="36" rx="1" fill="#D4A843" />
        <rect x="22" y="34" width="32" height="6" rx="1" fill="#D4A843" />
        <rect x="15" y="66" width="50" height="4" rx="1" fill="#D4A843" opacity="0.6" />
        <rect x="20" y="74" width="40" height="3" rx="1" fill="#D4A843" opacity="0.4" />
        <rect x="25" y="81" width="30" height="3" rx="1" fill="#D4A843" opacity="0.4" />
      </svg>
    );

    const BIBLE_POSITIONS = [
      { top:'4%',  left:'2%',   size:90,  rotate:-15, opacity:0.18 },
      { top:'4%',  right:'3%',  size:70,  rotate:20,  opacity:0.15 },
      { top:'25%', left:'-1%',  size:100, rotate:10,  opacity:0.14 },
      { top:'22%', right:'1%',  size:80,  rotate:-20, opacity:0.17 },
      { top:'45%', left:'3%',   size:75,  rotate:25,  opacity:0.15 },
      { top:'48%', right:'2%',  size:95,  rotate:-10, opacity:0.14 },
      { top:'65%', left:'1%',   size:85,  rotate:-25, opacity:0.17 },
      { top:'68%', right:'3%',  size:70,  rotate:15,  opacity:0.15 },
      { top:'82%', left:'4%',   size:90,  rotate:18,  opacity:0.14 },
      { top:'85%', right:'1%',  size:80,  rotate:-12, opacity:0.17 },
      { top:'14%', left:'45%',  size:65,  rotate:30,  opacity:0.12 },
      { top:'55%', left:'47%',  size:72,  rotate:-22, opacity:0.12 },
    ];

    const BibleBackground = () => (
      <div className="fixed inset-0 pointer-events-none overflow-hidden" style={{zIndex:0}}>
        {BIBLE_POSITIONS.map(({ top, left, right, bottom, size, rotate, opacity }, i) => (
          <div key={i} style={{ position:'absolute', top, left, right, bottom }}>
            <BibleSVG size={size} opacity={opacity} rotate={rotate} />
          </div>
        ))}
      </div>
    );

    // ─── Root ─────────────────────────────────────────────────────────────────
    // A freshly registered account is signed in but has no role yet. It sees this
    // and nothing else — no roster, no phone numbers — until an admin grants one.
    const PendingScreen = () => {
      const { t, username, signOut, lang, setLang } = useApp();
      return (
        <div className="min-h-screen flex items-center justify-center p-4" style={{ position:'relative' }}>
          <BibleBackground />
          <div className="w-full max-w-sm" style={{ position:'relative', zIndex:1 }}>
            <div className="bg-white rounded-2xl shadow-xl border border-gray-100 p-7 text-center">
              <div className="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto mb-4">
                <I.Clock />
              </div>
              <h1 className="text-xl font-bold text-gray-800 mb-1">{t.pendingTitle}</h1>
              <p className="text-sm text-gray-500 mb-5">{t.pendingBody(username || '')}</p>
              <div className="flex gap-2">
                <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')}
                  className="px-3 py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 text-sm font-semibold">
                  {t.langToggle}
                </button>
                <button onClick={signOut}
                  className="flex-1 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold text-sm">
                  {t.signOut}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const { view, apiError, authState, role } = useApp();

      // No application data is fetched or rendered until the server confirms a session.
      if (authState === 'checking') return <Spinner />;
      if (authState === 'anon')     return <SignInScreen />;
      if (role === 'pending')       return <PendingScreen />;

      return (
        <div className="min-h-screen" style={{position:'relative'}}>
          <BibleBackground />
          <Navbar />
          <div style={{position:'relative', zIndex:1}}>
            {apiError && (
              <div className="max-w-3xl mx-auto px-4 pt-4">
                <div className="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm font-medium">
                  {apiError}
                </div>
              </div>
            )}
            {view.name === 'home'       && <HomeView />}
            {view.name === 'meeting'    && <MeetingView />}
            {view.name === 'attendance' && <AttendanceView />}
            {view.name === 'history'    && <HistoryView />}
            {view.name === 'admin'      && <AdminView />}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(
      <Provider><App /></Provider>
    );
  </script>
</body>
</html>
